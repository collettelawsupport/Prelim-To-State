[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # These public configuration values intentionally appear in client output,
  # documentation, or tests and are not credentials.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,QBO_ENVIRONMENT,BIG_FORM_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the two public registration experiences separate while serving both from
# this one deployment. The Honor Roll domain must be assigned to this Netlify
# project as a domain alias before this rewrite becomes active.
[[redirects]]
  from = "https://honorrollregistration.texasourlittlemiss.net/"
  to = "/honor-roll/"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
